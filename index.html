<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Valentine's Day Ms.daina ❤️</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 28px 24px 36px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      position: relative;
    }

    h1 {
      color: #e6396f;
      margin-bottom: 8px;
      font-size: 2rem;
    }

    p {
      color: #444;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1.05rem;
    }

    .heart {
      color: #e6396f;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .photo-wrapper {
      position: relative;
      width: 260px;
      max-width: 100%;
      margin: 0 auto 16px;
      border-radius: 18px;
      overflow: hidden;
    }

    .photo-wrapper img {
      width: 100%;
      display: block;
    }

    /* Flower overlay */
    .flowers {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      pointer-events: none;
    }

    .footer {
      margin-top: 18px;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="photo-wrapper">
      <!-- Replace src with your image file name if needed -->
      <img src="aad37762-5458-410e-b64c-19b2b5d9c3f1.jpg" alt="Valentine surprise" />

     
    </div>

    <h1>Happy Valentine's Day Ms.diana<span class="heart">♥</span></h1>
    <p>This might be silly for me to create this website, but since you don’t want me to spend money on you, this is what I did instead.</p>

    <div class="footer">From albert 💕</div>
  </div>
</body>
</html>
